<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aksiya O'yini 🎰</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f7f5;--card:#fff;--tx:#18231d;--mu:#6b7a72;--ac:#16a34a;--rd:#dc2626;--bar:#e3e9e5;--blue:#2563eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--tx:#e8f1ec;--mu:#8fa196;--ac:#34d399;--rd:#f87171;--bar:#26332b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1511;--card:#17211b;--tx:#e8f1ec;--mu:#8fa196;--ac:#34d399;--rd:#f87171;--bar:#26332b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:480px;margin:0 auto;padding:14px;padding-bottom:80px; overflow-x: hidden;}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{flex:1 1 18%;padding:11px 2px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-weight:600;font-size:12.5px;transition: transform 0.1s;}
.tabs button:active{transform: scale(0.95);}
.tabs button.on{background:var(--ac);color:#fff;box-shadow: 0 4px 10px rgba(22,163,74,0.3);}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;transition: transform 0.2s, box-shadow 0.2s; animation: slideUp 0.3s ease-out;}
.card[data-open]{cursor:pointer}
.card[data-open]:active{transform: scale(0.98); background: var(--bar);}
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.mu{color:var(--mu);font-size:13px}
.n{font-size:36px;font-weight:800;margin:2px 0;}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.up{color:var(--ac)}.dn{color:var(--rd)}
.bt{display:flex;gap:6px;margin-top:10px}
.bt button,.pb{flex:1;padding:12px 2px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:13px; transition: transform 0.1s;}
.bt button:active, .pb:active { transform: scale(0.95); }
.bt button.s{background:var(--rd)}
.bt button:disabled{opacity:.4; transform: none;}
.gift{background:linear-gradient(135deg, var(--ac), #059669);color:#fff; box-shadow: 0 4px 15px rgba(22,163,74,0.4);}
.fi{display:block;width:100%;padding:12px 14px;margin:8px 0;border-radius:10px;border:2px solid var(--bar);background:var(--bg);color:var(--tx);font:inherit; outline: none; transition: border 0.2s;}
.fi:focus { border-color: var(--ac); }
.msg{min-height:20px;font-size:14px;margin-top:6px; font-weight: 600; color: var(--blue);}
.ic{border-radius:50%;object-fit:cover;flex:none;display:block;box-shadow:0 2px 5px rgba(0,0,0,.1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--bg); background: linear-gradient(45deg, #10b981, #3b82f6);}
.pb{display:block;width:100%}
h4{margin:0 0 2px;font-size:15px}

/* Effektlar */
.confetti { position: fixed; width: 10px; height: 10px; background-color: #f00; animation: fall 2s linear forwards; z-index: 9999; pointer-events: none;}
@keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

/* Ruletka */
.wheel-container { position: relative; width: 250px; height: 250px; margin: 20px auto; border-radius: 50%; border: 8px solid var(--card); box-shadow: 0 0 20px rgba(0,0,0,0.2); overflow: hidden; transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1); background: conic-gradient(#ef4444 0deg 45deg, #3b82f6 45deg 90deg, #10b981 90deg 135deg, #f59e0b 135deg 180deg, #8b5cf6 180deg 225deg, #ec4899 225deg 270deg, #06b6d4 270deg 315deg, #84cc16 315deg 360deg); }
.wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 30px; z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.5); color: var(--rd); }
.wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: var(--card); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.3); z-index: 5; }

/* Admin Panel Maxsus */
.admin-box { background: rgba(220, 38, 38, 0.1); border: 1px solid var(--rd); padding: 10px; border-radius: 10px; margin-top: 10px; }
.code-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 8px; border-radius: 8px; margin-bottom: 5px; font-size: 13px; }
.btn-toggle { padding: 4px 8px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; }
.btn-on { background: var(--ac); color: white; }
.btn-off { background: var(--rd); color: white; }
</style>
</head>
<body>
<div class="tabs" id="tb"></div>
<div id="app"></div>
<div class="mu" style="text-align:center;margin-top:8px">Oʻyin: haqiqiy pul va kompaniyalar emas.</div>

<script>
var ST=[
  {t:"QSH",n:"Quyosh Energiya",p:2.4,v:.035,d:.002,c:"QUYOSH"},
  {t:"TZK",n:"Tezkor Yetkazish",p:1.1,v:.06,d:.001,c:"TEZKOR"},
  {t:"ONN",n:"Oltin Non",p:4.8,v:.02,d:.001,c:"NON"},
  {t:"ZMT",n:"Zamon Texno",p:3.2,v:.05,d:.003,c:"ZAMON"},
  {t:"BHR",n:"Bahor Dori",p:.75,v:.08,d:0,c:"BAHOR"},
  {t:"YLQ",n:"Yoʻl Qurilish",p:5.5,v:.03,d:.0015,c:"YOL"},
  {t:"BMW",n:"BMW",p:2500,v:.12,d:0,c:"M5"},
  {t:"APPL",n:"Apple (iPhone)",p:3000,v:.08,d:.002,c:"IPHONE"}
];
var SM={};ST.forEach(function(s){SM[s.t]=s});var BASE_ST=ST.slice();
var BMSG="";
var K="aksiya6",S=null,TAB="w",DET=null,MSG="",down=false;
var isSpinning = false;

var PROMO_DB = {
  "BONUS50": { reward: 50, active: true },
  "BOYLIK": { reward: 500, active: true },
  "LUCK100": { reward: 0, luck: 100, active: true },
  "KATTA": { reward: 5000, active: true }
};

function fresh(){
  var px={},h={};
  ST.forEach(function(s){px[s.t]=s.p;h[s.t]=[s.p]});
  return{cash:10,hold:{},px:px,h:h,real:0,t:Date.now(),seen:false,admin:false,used:[],pp:{},custom:{},cstocks:[],luck:0, promoStates: JSON.parse(JSON.stringify(PROMO_DB))};
}

try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.px) S=fresh();
if(S.luck === undefined) S.luck = 0;
if(!S.promoStates) S.promoStates = JSON.parse(JSON.stringify(PROMO_DB));

function save(){S.t=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function rnd(){var u=0;for(var i=0;i<6;i++)u+=Math.random();return(u-3)/Math.sqrt(.5)}

// Narxlar o'zgarishi
function step(){
  ST.forEach(function(s){
    if(S.pp[s.t]!==undefined || S.px[s.t]===undefined || !S.h[s.t]) return;
    var c=S.px[s.t],p=c*(1+s.d+s.v*rnd()+.01*(s.p/c-1));
    if(p<.05)p=.05+Math.random()*.05;
    S.px[s.t]=p;var h=S.h[s.t];h.push(p);if(h.length>40)h.shift();
  });
}
var n0=Math.min(60,Math.floor((Date.now()-S.t)/4000));for(var i=0;i<n0;i++)step();

function f(x){return x.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function sg(x){return(x>=0?"+":"−")+"$"+f(Math.abs(x))}
function worth(){var v=0;for(var t in S.hold)v+=S.hold[t].sh*S.px[t];return v}
function coin(t,sz){return '<div class="ic" style="width:'+sz+'px;height:'+sz+'px;font-size:'+(sz/2.5)+'px">'+t.slice(0,2)+'</div>'}

function showConfetti() {
  for(var i=0; i<30; i++) {
    var c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.backgroundColor = ['#f00','#0f0','#00f','#ff0','#0ff'][Math.floor(Math.random()*5)];
    c.style.animationDuration = (Math.random()*1 + 1) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 2000);
  }
}

// --- VIEWS ---
function wallet(){
  var v=worth(),tot=S.cash+v,pl=tot-10,h="";
  h+='<div class="card"><div class="mu">Naqd pul</div><div class="n">$'+f(S.cash)+'</div></div>';
  h+='<div class="card"><div class="row"><span class="mu">Omadingiz (Luck)</span><b style="color:'+(S.luck>=100?'var(--ac)':'var(--mu)')+'">'+S.luck+' / 100 🍀</b></div>';
  if(S.luck >= 100) h+='<div class="mu" style="color:var(--ac); margin-top:5px; font-weight:bold;">🔥 Sizda kazinoga kirish huquqi bor!</div>';
  h+='</div>';
  h+='<div class="card"><div class="row"><span class="mu">Jami boylik</span><b>$'+f(tot)+'</b></div><div class="row" style="margin-top:8px"><span class="mu">Foyda / zarar</span><b class="'+(pl>=0?"up":"dn")+'">'+sg(pl)+'</b></div></div>';
  return h;
}

function market(){
  return ST.map(function(s){
    var p=S.px[s.t]||s.p,H=S.hold[s.t];
    return '<div class="card" data-open="'+s.t+'"><div class="row"><div style="display:flex;gap:10px;align-items:center">'+coin(s.t,46)+'<div><b>'+s.n+'</b><div class="mu">'+(H?H.sh.toFixed(3):"0")+' ta</div></div></div></div><div class="row" style="margin-top:6px"><b>$'+f(p)+'</b></div></div>';
  }).join("");
}

function gambleView(){
  var h = '<div class="card" style="text-align:center; border: 2px solid '+(S.luck>=100?'gold':'var(--bar)')+'"><h4 style="font-size:20px;color:'+(S.luck>=100?'gold':'var(--tx)')+'">🎰 Maxsus Kazino</h4>';
  if(S.luck < 100) {
    h += '<div class="mu" style="margin:20px 0; font-size:16px;">Kazinoga kirish uchun sizga <b>Omad (Luck)</b> kerak. Hozircha sizda: <b>'+S.luck+' / 100</b></div>';
    h += '</div>'; return h;
  }
  h += '<div class="mu" style="margin-bottom:20px; color:var(--ac); font-weight:bold;">Omad 100%! Siz kazinodasiz.</div>';
  h += '<div class="wheel-pointer">🔻</div><div id="wheel" class="wheel-container"><div class="wheel-center">$</div></div>';
  h += '<div class="mu" style="margin-top:20px">Pul tikish (Min: $10)</div>';
  h += '<input class="fi" id="betAmount" type="number" placeholder="Tikiladigan miqdor ($)" style="text-align:center;font-size:18px;">';
  h += '<button class="pb" style="padding:16px;font-size:18px;background:linear-gradient(135deg, #f59e0b, #d97706);color:white;" data-a="spin">Aylantirish 🎡</button>';
  h += '<div class="msg" id="gambleMsg" style="text-align:center;font-size:16px;margin-top:15px;min-height:24px;"></div></div>';
  return h;
}

function port(){
  var k=Object.keys(S.hold),h="";
  h+=k.length?k.map(function(t){
    var H=S.hold[t],val=H.sh*S.px[t];
    return '<div class="card" data-open="'+t+'"><div class="row"><div style="display:flex;gap:10px;align-items:center">'+coin(t,40)+'<div><b>'+SM[t].n+'</b><div class="mu">'+H.sh.toFixed(3)+' ta</div></div></div><b>$'+f(val)+'</b></div></div>';
  }).join(""):'<div class="card mu" style="text-align:center">Aksiyangiz yoʻq.</div>';
  
  h+='<div class="card"><h4>🎟 Promokod</h4><input class="fi" id="pi" placeholder="Promokodni kiriting" autocapitalize="characters"><button class="pb" data-a="pc">Qoʻllash</button><div class="msg">'+MSG+'</div></div>';
  
  if(S.admin) {
    h+='<div class="card admin-box"><h4 style="color:var(--rd)">👑 Admin Panel</h4>';
    h+='<div class="mu" style="margin-bottom:10px">Omad qo\'shish:</div>';
    h+='<input class="fi" id="luckAdd" type="number" placeholder="Omad (masalan: 100)">';
    h+='<button class="pb" style="background:var(--rd); margin-bottom:15px;" data-a="addluck">O\'zimga omad qo\'shish</button>';
    
    h+='<div class="mu" style="margin-bottom:5px; font-weight:bold; color:var(--tx);">Promokodlar holati:</div>';
    for(var code in S.promoStates) {
      var p = S.promoStates[code];
      var btnClass = p.active ? 'btn-off' : 'btn-on';
      var btnText = p.active ? 'O\'chirish' : 'Yoqish';
      var statusColor = p.active ? 'var(--ac)' : 'var(--rd)';
      h+='<div class="code-item">';
      h+='<span><b>'+code+'</b> ('+(p.reward?'$'+p.reward:'Luck')+')</span>';
      h+='<div style="display:flex; align-items:center; gap:5px;">';
      h+='<span style="font-size:10px; color:'+statusColor+'">'+(p.active?'Faol':'Nofaol')+'</span>';
      h+='<button class="btn-toggle '+btnClass+'" data-a="togglePromo" data-code="'+code+'">'+btnText+'</button>';
      h+='</div></div>';
    }
    
    h+='<button class="pb" style="margin-top:10px; background:var(--mu)" data-a="ax">Admindan chiqish</button></div>';
  }
  return h;
}

function detail(t){
  var s=SM[t],p=S.px[t]||s.p,H=S.hold[t],sh=H?H.sh:0,d=S.cash<.01?" disabled":"",ds=sh<1e-6?" disabled":"";
  var o='<button class="bk" data-a="bk">← Orqaga</button>';
  o+='<div class="card"><div class="row"><div style="display:flex;gap:12px;align-items:center">'+coin(t,64)+'<div><b>'+s.n+'</b></div></div></div><div class="n" style="font-size:42px">$'+f(p)+'</div></div>';
  o+='<div class="card"><div class="mu">Sizda bor</div><div class="n" style="font-size:32px">'+sh.toFixed(3)+' ta</div></div>';
  o+='<div class="card"><div class="mu">Naqd pul: $'+f(S.cash)+'</div><input class="fi" id="bd" type="number" placeholder="Miqdor ($)"><div class="bt"><button data-a="bx" data-t="'+t+'"'+d+'>Sotib olish</button></div><div class="bt"><button class="s" data-a="s" data-t="'+t+'" data-f="1"'+ds+'>Hammasini sotish</button></div></div>';
  return o;
}

function render(){
  var T=[["w","💵 Hamyon"],["m","📈 Bozor"],["p","💼 Portfel"],["g","🎰 Omad"]];
  document.getElementById("tb").innerHTML=T.map(function(x){return'<button data-a="tab" data-t="'+x[0]+'" class="'+(TAB===x[0]&&!DET?"on":"")+'">'+x[1]+'</button>'}).join("");
  document.getElementById("app").innerHTML=DET?detail(DET):TAB==="w"?wallet():TAB==="m"?market():TAB==="p"?port():TAB==="g"?gambleView():wallet();
}

// --- TUGMALAR ---
document.body.addEventListener("click", function(e){
  var btn = e.target.closest("button");
  if(!btn) {
    var card = e.target.closest("[data-open]");
    if(card){ DET = card.getAttribute("data-open"); render(); }
    return;
  }
  
  var a = btn.getAttribute("data-a"), t = btn.getAttribute("data-t"), code = btn.getAttribute("data-code"), f = btn.getAttribute("data-f");
  if(navigator.vibrate) navigator.vibrate(30);
  
  if(a === "tab"){ TAB = t; DET = null; MSG = ""; render(); }
  else if(a === "bk"){ DET = null; render(); }
  
  else if(a === "pc"){
    var inputCode = document.getElementById("pi").value.trim().toUpperCase();
    if(inputCode === "ADMIN2024") {
      S.admin = true; MSG = "✅ Admin huquqi berildi!"; save(); render();
    } else if (S.promoStates[inputCode]) {
      var promo = S.promoStates[inputCode];
      if(!promo.active) {
        MSG = "❌ Bu promokod vaqtincha o'chirilgan!"; render();
      } else if (S.used.includes(inputCode)) {
        MSG = "❌ Siz bu promokodni allaqachon ishlatgansiz!"; render();
      } else {
        if(promo.reward) S.cash += promo.reward;
        if(promo.luck) S.luck += promo.luck;
        S.used.push(inputCode);
        MSG = "✅ Promokod qabul qilindi!"; showConfetti(); save(); render();
      }
    } else {
      MSG = "❌ Noto'g'ri kod"; render();
    }
  }
  
  else if(a === "togglePromo" && S.admin) {
    if(S.promoStates[code]) {
      S.promoStates[code].active = !S.promoStates[code].active;
      save(); render();
    }
  }
  
  else if(a === "addluck"){
    var lVal = parseInt(document.getElementById("luckAdd").value) || 0;
    if(lVal > 0) { S.luck += lVal; save(); MSG = "✅ Omad +" + lVal; render(); }
  }
  else if(a === "ax"){ S.admin = false; save(); render(); }
  
  else if(a === "spin"){
    if(isSpinning || S.luck < 100) return;
    var betInput = document.getElementById("betAmount");
    var bet = parseFloat(betInput.value);
    var msgEl = document.getElementById("gambleMsg");
    var wheel = document.getElementById("wheel");
    
    if(isNaN(bet) || bet < 10) { msgEl.innerText = "❌ Minimal tikish $10!"; return; }
    if(S.cash < bet) { msgEl.innerText = "❌ Pulingiz yetarli emas!"; return; }
    
    isSpinning = true; S.cash -= bet; save();
    msgEl.innerText = "Aylanmoqda...";
    
    var randomDeg = Math.floor(Math.random() * 360) + 1800; 
    wheel.style.transform = "rotate(" + randomDeg + "deg)";
    
    setTimeout(function() {
      var isWin = Math.random() < 0.5;
      if(isWin) {
        S.cash += bet * 2; msgEl.innerText = "🎉 YUTDINGIZ! +$" + f(bet * 2); msgEl.style.color = "var(--ac)"; showConfetti();
      } else {
        msgEl.innerText = "😢 Yutqazdingiz! -$" + f(bet); msgEl.style.color = "var(--rd)";
      }
      setTimeout(function(){
        wheel.style.transition = "none"; wheel.style.transform = "rotate(0deg)"; 
        setTimeout(function(){ wheel.style.transition = "transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)"; isSpinning = false; }, 50);
      }, 500);
      save(); betInput.value = "";
    }, 3100);
  }
  
  else if(a === "bx"){
    var inp = document.getElementById("bd");
    var val = inp ? (parseFloat(inp.value) || S.cash) : S.cash;
    if(val > 0 && S.cash >= val) {
      S.cash -= val;
      if(!S.hold[t]) S.hold[t] = {sh:0, cost:0};
      S.hold[t].sh += val / S.px[t]; S.hold[t].cost += val;
      save(); render();
    }
  }
  else if(a === "s"){
    var part = f ? parseFloat(f) : 1;
    if(S.hold[t]){
      var earn = (S.hold[t].sh * part) * S.px[t];
      S.cash += earn; S.hold[t].sh -= (S.hold[t].sh * part);
      if(S.hold[t].sh < 0.0001) delete S.hold[t];
      save(); render();
    }
  }
});

setInterval(step, 3000);

// 🔥 MUAMMO HAL QILINDI: Ekran faqat inputda yozmayotganingizda yangilanadi
setInterval(function() { 
  var active = document.activeElement;
  var isTyping = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT");
  
  if(!DET && TAB!=="g" && !isTyping) {
    render(); 
  }
}, 3000); 

render();
</script>
</body>
</html>
